services:
  # 1. SIEM & XDR CORE (Wazuh Manager Headless CLI)
  soc-siem:
    image: wazuh/wazuh-manager:4.9.0
    container_name: soc-siem
    hostname: wazuh-manager
    restart: unless-stopped
    mem_limit: 1200m
    ports:
      - "1514:1514/tcp"     # Nhận log EDR từ Agent
      - "1515:1515/tcp"     # Đăng ký Agent mới
      - "514:514/udp"       # Nhận Syslog từ pfSense & Suricata
      - "55000:55000/tcp"   # Wazuh API
    environment:
      - API_USERNAME=${WAZUH_API_USERNAME:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-MyS3cr3tP4ssw0rd.!}
    volumes:
      - wazuh_logs:/var/ossec/logs
      - wazuh_etc:/var/ossec/etc
      - ./configs/wazuh/local_decoder.xml:/var/ossec/etc/decoders/local_decoder.xml:ro
      - ./configs/wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./configs/wazuh/ossec.conf:/var/ossec/etc/ossec.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # 2. AI AGENT CONTROLLER & WEB VISUALIZE UI (Port 8080)
  soc-ai-agent:
    build: ./agent
    container_name: soc-ai-agent
    network_mode: "host"
    privileged: true
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://192.168.63.1:11434/api/chat}
      - LLM_MODEL=${LLM_MODEL:-qwen3.5:4b}
      - WAZUH_ALERT_FILE=${WAZUH_ALERT_FILE:-/var/ossec/logs/alerts/alerts.json}
      - WAZUH_MIN_ALERT_LEVEL=${WAZUH_MIN_ALERT_LEVEL:-5}
      - PFSENSE_API_URL=${PFSENSE_API_URL:-https://192.168.171.2/api/v2}
      - PFSENSE_API_KEY=${PFSENSE_API_KEY}
      - PFSENSE_ALIAS_NAME=${PFSENSE_ALIAS_NAME:-SOC_BLOCKLIST}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
    volumes:
      - ./agent:/app
      - wazuh_logs:/var/ossec/logs:ro
    depends_on:
      - soc-siem
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  wazuh_logs:
  wazuh_etc:
